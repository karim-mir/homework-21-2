{% extends 'home.html' %}
{% load my_tags %}
{% block content %}
<div class="container mt-5">
    <div class="text-center">
        <h1>Главная</h1>
        <h6>Вы находитесь на сайте, предназначенном для продажи товаров.</h6>
    </div>
    <div class="row mt-3">
        {% for product in products %}
        <div class="col-sm-4 mb-4">
            <div class="card text-center" style="height: 400px; display: flex; flex-direction: column; justify-content: space-between;">
                <img src="{{ product.photo | media_filter }}" alt="{{ product.name }}" class="card-img-top" style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-header">{{ product.category }}</h5>
                    <p class="price">{{ product.price }}</p>
                    <p class="card-text">{{ product.name }}</p>
                    <a class="btn btn-primary" href="{% url 'catalog:product_detail' product.pk %}" role="button">Купить</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
