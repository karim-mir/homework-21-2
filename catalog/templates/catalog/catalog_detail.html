{% extends 'catalog/home.html' %}
{% load my_tags %}
{% block base_content %}
<div class="container mt-5">
    <div class="text-center">
        <h1>Главная</h1>
        <h6>Вы находитесь на сайте, предназначенном для продажи товаров.</h6>
    </div>
    <div class="row mt-3">
        <div class="col-sm-4 mb-4">
            <div class="card text-center" style="height: 100%;">
                <img src="{{ product.photo | media_filter }}" alt="{{ product.name }}" class="card-img-top"
                     style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-header">{{ object.category }}</h5>
                    <p class="price">{{ object.price }}</p>
                    <p class="card-text">{{ object.name }}</p>
                    <p class="card-text">{{ object.description }}</p>
                    <div class="mt-auto">
                        <a class="btn btn-primary w-100" href="{% url 'catalog:catalog_list' %}" role="button">Назад</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
