{% extends 'catalog/home.html' %}
{% block base_content %}
<div class="container mt-8">
    <form class="row" method="post" enctype="multipart/form-data" style="margin-top: 50px;">  <!-- Встроенный стиль -->
        <div class="col-6 offset-3">  <!-- Сдвигаем на 3 колонки вправо -->
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Зарегистрироваться
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
